name: benchmark_suite
description: Local benchmark and stress-test app for StateForge rebuild behavior.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  flutter_bloc: ^9.1.1
  state_forge:
    path: ../

dependency_overrides:
  state_forge_core:
    path: ../packages/state_forge_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
